name: muslim_soul_web
description: "Marketing and web companion site for the Muslim Soul prayer app."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.3

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  adhan: ^2.0.0+1
  flutter_animate: ^4.5.2
  flutter_riverpod: ^3.3.2
  geolocator: ^14.1.2
  go_router: ^17.5.0
  http: ^1.6.0
  intl: ^0.20.2
  shared_preferences: ^2.5.6
  url_launcher: ^6.3.3
  web: ^1.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: true

  # Every other font in assets/fonts/ is loaded on demand by FontRegistry
  # (lib/core/typography/fonts.dart), so only Latin ships up front.
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/inter_regular.ttf
        - asset: assets/fonts/inter_semibold.ttf
          weight: 600
        - asset: assets/fonts/inter_bold.ttf
          weight: 700

  assets:
    - assets/fonts/
    - assets/icons/clay/
    - assets/icons/gold_emerald/
    - assets/icons/frosted_glass/
    - assets/icons/night_glow/
    - assets/screenshots/
